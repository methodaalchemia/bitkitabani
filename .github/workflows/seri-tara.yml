name: Çizim serisi taraması (elle)
on:
  workflow_dispatch:
jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pillow && python3 tools/seri_tara.py
      - uses: actions/upload-artifact@v4
        with: { name: seri-tara, path: seri_tara.json }
