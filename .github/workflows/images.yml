name: Görselleri eşitle ve siteyi derle
on:
  push:
    branches: [main]
    # Tek tek dosya saymak yerine bütün kaynak dosyaları: liste
    # eksik kaldığında o modülün değişikliği sessizce yayına çıkmıyordu
    # (5 Kasım'da altı motif sayfası böyle kayboldu). Derlemenin kendi
    # çıktıları ve botun yazdığı dosyalar hariç tutuluyor.
    paths:
      - '**.py'
      - '**.json'
      - 'en/**'
      - 'kuyruk/**'
      - 'tools/**'
      - 'assets/**'
      - 'img/imza-*'
      - 'img/hikaye-gorsel/**'
      - '.github/workflows/images.yml'
      - '!site/**'
      - '!images.json'
      - '!inat.json'
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Bütün adresleri IndexNow ile gönder'
        default: '0'
  schedule:
    - cron: '5 21 * * *'
permissions:
  contents: write
concurrency: images
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tools/fetch_images.py
      - run: pip install pillow && python3 tools/webp.py
      - name: Yazı tipleri (Instagram slaytları için, OFL lisanslı)
        run: |
          mkdir -p tools/fonts; cd tools/fonts
          for f in "alegreya/Alegreya%5Bwght%5D.ttf" "alegreya/Alegreya-Italic%5Bwght%5D.ttf" "alegreyasans/AlegreyaSans-Regular.ttf" "alegreyasans/AlegreyaSans-Bold.ttf" "alegreyasans/AlegreyaSans-Italic.ttf" "courierprime/CourierPrime-Regular.ttf" "alegreya/OFL.txt"; do
            n=$(basename "$f" | sed 's/%5B/[/;s/%5D/]/'); [ -f "$n" ] || curl -sSfL -o "$n" "https://raw.githubusercontent.com/google/fonts/main/ofl/$f" || true
          done
      - name: Sosyal medya simgeleri (Simple Icons, CC0)
        continue-on-error: true
        run: |
          mkdir -p assets/icons
          for n in instagram threads pinterest facebook bluesky telegram rss whatsapp; do [ -f assets/icons/$n.svg ] || curl -sSfL -o assets/icons/$n.svg "https://cdn.jsdelivr.net/npm/simple-icons@11.0.0/icons/$n.svg" || true; done
      - name: Site yazı tipleri (WOFF2)
        continue-on-error: true
        run: pip install fonttools brotli && python3 tools/fonts_web.py
      - name: iNaturalist gözlem ayları
        continue-on-error: true
        run: python3 tools/inat.py
      - name: Tanıma görselleri (çizim, çiçek, kuru)
        continue-on-error: true
        run: pip install -q pillow segno && python3 tools/tanima.py
      - name: Hikâye kapakları
        run: python3 tools/kapak.py
      - run: python3 build.py
      - name: ffmpeg (Reels videoları için)
        continue-on-error: true
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Reels seslendirmesi (edge-tts)
        continue-on-error: true
        run: pip install -q edge-tts
      - name: Instagram postları
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/ig.py
      - name: Önceki Reels dosyalarını geri al (igmedia dalı silinmesin)
        continue-on-error: true
        run: |
          git clone -q --depth 1 --branch igmedia "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/old || exit 0
          mkdir -p igout
          for d in cay yt; do [ -d "/tmp/old/$d" ] && cp -rn "/tmp/old/$d" igout/ || true; done
      - name: Çay bitkileri Reels
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/cay_reel.py
      - name: Instagram dosyalarını ayrı dala yaz (geçmiş tutulmaz)
        continue-on-error: true
        run: |
          [ -f igout/state.json ] || exit 0
          cd igout && git init -q && git checkout -q -b igmedia && git add -A
          git -c user.name="bitkitabani-bot" -c user.email="actions@users.noreply.github.com" commit -qm "Instagram dosyaları [bot]"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" igmedia
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "bitkitabani-bot"
          git config user.email "actions@users.noreply.github.com"
          ekle() {
            git add img images.json site tools/fonts assets/fonts assets/icons
            if [ -f inat.json ]; then git add inat.json; fi
          }
          ekle
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "Görseller ve site güncellendi [bot]"
          # ⚠️ Burada eskiden `git pull --rebase -X theirs` vardı. Rebase'de
          # "theirs" botun kendi commit'i demek; yani iş akışı başladığı
          # andaki derlemeyi, araya giren daha YENİ bir derlemenin üstüne
          # yazıyordu. Kaynak sağlam kalıyor, site/ eskiyor, değişiklik
          # canlıda görünmüyordu (17 Kasım 2026'da iki kez oldu).
          # Doğrusu: çakışmada karşı tarafı koru, sonra site/'ı birleşmiş
          # kaynaktan YENİDEN DERLE ve commit'i tazele.
          # ⚠️ İkinci tuzak (17-19 Kasım 2026'da üç derlemeyi düşürdü): rebase
          # sırasında botun kendi commit'i "patch contents already upstream"
          # diye DÜŞEBİLİYOR. O durumda `git commit --amend` botun commit'ini
          # değil, tepedeki BAŞKASININ commit'ini yeniden yazıyor; dal remote'tan
          # ayrılıyor ve push "non-fast-forward / branch is behind" diye reddediliyor.
          # Doğrusu: tepede hâlâ botun kendi commit'i varsa tazele, yoksa yeni commit aç.
          MESAJ="Görseller ve site güncellendi [bot]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 10) + 5 ))     # araya giren push'la yarışmayalım
            git pull --rebase -X ours || { git rebase --abort || true; exit 1; }
            python3 build.py
            ekle
            if git diff --cached --quiet; then continue; fi
            if [ "$(git log -1 --format=%s)" = "$MESAJ" ]; then
              git commit --amend --no-edit
            else
              git commit -m "$MESAJ"
            fi
          done
          echo "beş denemede push edilemedi"; exit 1
      - name: IndexNow bildirimi (yayına alınması için kısa bekleme)
        if: always()
        continue-on-error: true
        env:
          ALL: ${{ github.event.inputs.indexnow_all }}
        run: sleep 120 && python3 tools/indexnow.py
