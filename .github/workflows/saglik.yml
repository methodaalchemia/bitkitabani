name: Haftalık site kontrolü
on:
  schedule:
    - cron: '17 5 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 build.py
      - id: k
        run: python3 tools/saglik.py
        continue-on-error: true
      - name: Sorun varsa kayıt aç
        if: steps.k.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Haftalık kontrol - düzeltilecekler $(date +%Y-%m-%d)" --body-file rapor.md
